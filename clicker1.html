<! html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial=1.0">
<title>?</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
 body {
    background:#0a0a0f; color:#c8c8d0;
    font-family:Georgia, 'Times New Roman', serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:20px; user-select:none;
  }
  #eraTitle { font-size:1.6em; letter-spacing:4px; color:#e8e8f0; text-transform:uppercase;
    text-align:center; transition:color 2s; margin-bottom:4px; }
  #eraSub { font-style:italic; color:#666670; font-size:0.95em; margin-bottom:24px;-align:center; min-height:1.2em; }
  #counter { font-size:2.4em; color:#d4ca; margin-bottom:6px; }
  #perSec { color:#55555f; margin-bottom:28px; }
  #clickArea {
    width:220px; height:220px; border-radius:50%;
    border:2px solid #2a2a35; cursor:pointer; position:relative;
    background:radial-gradient(circle at 35% 35%, #1d1d2a, #101018);
    transition:transform 0.05s, box-shadow 0.5s; margin-bottom:8px;
    display:flex; align-items:center; justify-content:center;
  }
  #clickArea:active { transform:scale(0.96); }
  #glyph { font-size:64px; color:#8a8672; transition:color 1s, font-size 1s; }
  .float {
    position:absolute; pointer-events:none; font-size:1.1em; color:#d4c98a;
    animation:floatUp 1s ease-out forwards;
  }
  @keyframes floatUp { to { transform:translateY(-px); opacity:0; } }
  .tabs { display:flex; gap:8px; margin:20px 0 12px; }
  .tab {
    padding:8px 18px; border:1px solid #2a2a35; background:transparent; color:#77777f;
    cursor:pointer; font-family:inherit; letter-spacing:2px; text-transform:uppercase; font-size:0.8em;
  }
  .tab.active { color:#d4c98a; border-color:#4a4636 }
  .panel { width:100%; max-width:640px; min-height:200px; }
  .row {
    border1px solid #1d1d28; padding:12px 16px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .row.afford { border-color:#3a3828; cursor:pointer; }
  .row.afford:hover { background:#14141c; }
  .row.locked { color:#44444c; font-style:italic; }
  .row .name { color:#d8d4c0; }
  .row .desc { font-size:0.8em; color:#666670; margin-top:2px; }
  .row .cost { color:#b09d5a; white-space:nowrap; margin-left:16px; }
  .row.hiddenRow { border:1px dashed #1a1a24; color:#3a3a44; padding:12px 16px; margin-bottom:8px; text-align:center; font-style:italic; }
  #log { max-width:640px; width:100%; margin-top:24px; border-top1px solid #1d1d28; padding-top:14px; }
  .logline { color:#55555f; font-size:0.85em; font-style:italic; padding:3px 0; opacity:0; animation:fadeIn 2s forwards; }
  .logline.major { color:#b8a96a; }
  @keyframes fadeIn { to { opacity:1; } }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity 1.5s; }
  .buyMax { font-size:0.75em; color:#6a6450; }
  #reset { margin-top:30px; background:none; border:none; color:#33333a; cursor:pointer; font-family:inherit; font-size:0.75em; }
  #reset:hover { color:#6a4a4a; }
  .prestige { color:#7a6fa8 !important; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="eraTitle">The Beginning</div>
<div id="eraSub"></div>
<div id="counter">0</div>
<div id="perSec">per second: 0>

<div id="clickArea"><span id="glyph">●</span></div>

<div class="tabs">
  <button class="tab" data-tab="discover">Discover</button>
  <button class="tab" data-tab="works">Works</button>
</div>
<div class="panel" id="panel-discover"></div>
<div class="panel" id="panel-works" style="display:none"></div>

<div id="log"></div>
<button id="reset">abandon everything</button>

<script>
// ---------- state ----------
let S = {
  insight: 0, total: 0, clicks: 0,
  discoveries: {},   // id -> count
  works: {},         // id -> true
  era: 0,
  last: Date.now()
};

// ---------- discoveries (generators + click upgrades) ----------
const DISCOVERIES = [
  {id:'d1', era:0, name:'Curiosity', desc:'The mind begins to wonder.', base:15, growth:1.15, cps:0.1, click:0},
  {id:'d2', era:0, name:'Language', desc:'Ideas can now be shared.', base:100, growth:1.15, cps:1, click:0},
 id:'d3', era:0, name:'Fire', desc:'Warmth in the darkness.', base:60, growth:1.18, cps:0, click:1},
  {id:'d4', era:1, name:'??', desc:'??', base:1100, growth:1.15, cps:8, click:0, hint:'Something that turns soil.'},
  {id:'d5', era:1, name:'??', desc:'??', base:12000, growth:1.15, cps:47, click:0, hint:'Herds, gathered and kept.'},
  {id:'d6', era:2, name:'??', desc:'??', base:130000, growth:1.15, cps:260, click:0, hint:'It can be shaped, and keeps its edge.'},
  {id:'d7', era:2, name:'??', desc:'??', base:1.4e6, growth:1.15, cps:1400, click:0, hint:'Words that outlive their speakers.'},
  {id:'d8', era:3, name:'??', desc:'??', base:2e7, growth:1.15, cps:7800, click:0, hint:'Not by muscle alone.'},
  {id:'d9', era:3, name:'??', desc:'??', base:3.3e8, growth:1.15, cps:44000, click:0, hint:'Rot, harnessed.'},
  {id:'d10', era:4, name:'??', desc:'??', base:5.1e9, growth:1.15, cps:260000, click:0, hint:'Braided lightning.'},
  {id:'d11', era:4, name:'??', desc:'??', base:7.5e10, growth:1.15, cps:1.6e6, click:0, hint:'A machine that dreams in numbers.'},
  {id:'d12', era:5, name:'??', desc:'??', base:1e12, growth:1.15, cps:1e7, click:0, hint:'The smallest things, rearranged.'},
  {id:'d13', era:5, name:'??', desc:'??', base:1.4e13, growth:1.15, cps:6.5e7, click:0, hint:'Departure.'},
];

// ---------- works (one-time click/production boosts) ----------
const WORKS = [
  {id:'w1', era:0, name:'Named the Stars', desc:'Clicks are worth more.', cost:500, clickMult:2},
  {id:'w2', era:1, name:'The Wheel', desc:'Everything turns easier.', cost:20000, cpsMult:1.5},
  {id:'w3', era:1, name:'Written Law', desc:'What was agreed is remembered.', cost:150000, cpsMult:1.5},
  {id:'w4', era:2, name:'??', desc:'??', cost:2e6, clickMult:3, hint:'A structure that reaches.'},
  {id:'w5', era:2, name??', desc:'??', cost:2e7, cpsMult:2, hint:'A disease made harmless.'},
  {id:'6', era:3, name:'??', desc:'??', cost:5e8, cpsMult:2, hint:'The world, drawn whole.'},
  {id:'w7', era:3, name:'??', desc:'??', cost:9e9, clickMult:5, hint:'Voices carried without wires.'},
  {id:'w8', era:4, name:'??', desc??', cost:2e11, cpsMult:2.5, hint:'Taming the sun\'s fire, briefly.'},
  {id:'w9', era:4, name:'??', desc:'??', cost:4e12, cpsMult:2.5, hint:'A network of everyone.'},
  {id:'w10', era:5, name:'??', desc:'??', cost:9e13, cpsMult:3, hint:'Machines that teach themselves.'},
];

// ---------- eras ----------
const ERAS = [
  {at:0,     name:'The Dawn',     sub:'nothing is certain yet', glyph:'●', color:'#8a8672'},
  {at:500,   name:'??', sub:'??', glyph:'?', color:'#a08a5a'},
  {at:50000, name:'??', sub:'??', glyph:'?', color:'#b8a96a'},
  {at:5e6,   name:'??', sub:'??', glyph:'?', color:'#c9b070'},
  {at:2e8,   name:'??', sub:'??', glyph:'?', color:'#9aa8b8'},
  {at:5e10, :'??', sub:'??', glyph:'?', color:'#aab8d0'},
  {at:1e13,  name:'??', sub:'??', glyph:'?', color:'#c8b8e8'},
];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function fmt(n){
  if (n < 1000) return Math.floor(n).toString();
  const units=['K','M','B','T','Qa','Qi','Sx','Sp'];
  let i=-1;
  while(n>=1000 && i<units.length-1){ n/=1000; i++; }
  return n.toFixed(2)+units[i];
}
function log(msg, major){
  const el=document.createElement('div');
  el.className='logline'+(major?' major':'');
  el.textContent=msg;
  $('log').prepend(el);
}
function discoverCost(d){ return d.base * Math.pow(d.growth, S.discoveries[d.id]||0); }
function(){
  let sum=0, mult=1;
  for(const d of DISCOVERIES) sum += (S.discoveries[d.id]||0)*d.cps;
  for(const w of WORKS) if(S.works[w.id] && w.cpsMult) multw.cpsMult;
  return sum*mult;
}
function clickPower(){
  let base=1, mult=1;
  for(const d of DISCOVERIES) base += (S.discoveries[d.id]||0)*d.click;
  for(const w of WORKS) if(S.works[w.id] && w.clickMult) mult*=w.clickMult;
  return base*mult;
}

// ---------- era transitions ----------
function checkEra(){
  for(let i=ERAS.length-1;i>0;i--){
    if(S.era < i && S.total >= ERAS[i].at){
      S.era = i;
      const e=ERAS[i];
      $('eraTitle').textContent = e.name;
      $('eraSub').textContent = e.sub;
      $('glyph').textContent = e.glyph;
      $('glyph').style.color = e.color;
      $('flash').style.opacity=0.5;
      setTimeout(()=>$('flash').style.opacity=0, 300);
      log('A new age begins.', true);
      if(e.name==='??') log('You cannot yet name what you have become.');
      save();
      break;
    }
  }
}

// ---------- rendering ----------
function renderDiscoveries(){
  const p=$('panel-discover'); p.innerHTML='';
  for(const d of DISCOVERIES){
    if(d.era > S.era) continue;
    const owned=S.discoveries[d.id]||0;
    const cost=discoverCost(d);
    const shown = d.name!=='??' || owned>0 || S.insight>=cost*0.4;
    const row=document.createElement('div');
    if(!shown){
      row.className='hiddenRow';
      row.textContent = d.hint || 'something waits to be found';
    } else {
      const name = d.name==='??' ? 'A Strange Idea' : d.name;
      const desc = d.name==='??' ? '??' : d.desc;
      row.className='row'+(S.insight>=cost?' afford':'');
      row.innerHTML=`<div><div class="name">name<spanclass="buyMax">×{name} <span class="buyMax">×name<spanclass="buyMax">×{owned}</span></div>
        <div class="desc">desc⋅+{desc} · +desc⋅+{d.cps}/s{d.click?` · +{d.click}/click`:''}</div></div>
        <div class="cost">${fmt(cost)}</div>`;
      row.onclick=()=>{
        if(S.insight>=cost){
          S.insight-=cost;
          S.discoveries[d.id]=owned+1;
          if(d.name==='??'){
            const idx=DISCOVERIES.indexOf(d);
            log('Discovered: '+d.name, true);
          }
          render(); save();
        }
      };
    }
    p.appendChild(row);
  }
  if(S.era < ERAS.length-1){
    const next=ERAS[S.era+1];
    const bar=document.createElement('div');
    bar.className='hiddenRow';
    bar.textContent=`something greater stirs... (fmt(S.total)/{fmt(S.total)} /fmt(S.total)/{fmt(next.at)})`;
    p.appendChild(bar);
  }
}
function renderWorks(){
  const p=$('panel-works'); p.innerHTML='';
  let any=false;
  for(const w of WORKS){
    if(w.era > S.era) continue;
    any=true;
    if(S.works[w.id]) continue;
    const shown = w.name!=='??' || S.insight>=w.cost*0.25;
    const row=document.createElement('div');
    if(!shown){
      row.className='hiddenRow';
      row.textContent = w.hint || 'a great work waits';
    } else {
      const name = w.name==='??' ? 'An Unfinished Work' : w.name;
      const desc = w.name==='??' ? '??' : w.desc;
      const effect = w.clickMult?`×w.clickMultclicks‘:‘×{w.clickMult} clicks`:`×w.clickMultclicks‘:‘×{w.cpsMult} production`;
      row.className='row'+(S.insight>=w.cost?' afford':'');
      row.innerHTML=`<div><div class="name">name</div><divclass="desc">{name}</div><div class="desc">name</div><divclass="desc">{desc} · ${effect}</div></div>
        <div class="cost">${fmt(w.cost)}</div>`;
      row.onclick=()=>{
        if(S.insight>=w.cost){
          S.insight-=w.cost;
          S.works[w.id]=true;
          log('Completed: '+w.name, true);
          render(); save();
        }
      };
    }
    p.appendChild(row);
  }
  if(!any) p.innerHTML='<div class="hiddenRow">nothing worth building... yet</div>';
}
function render(){
  $('counter').textContent=fmt(S.insight);
  $('perSec').textContent='per second: '+fmt(cps());
  renderDiscoveries(); renderWorks();
}

// ---------- input ----------
$('clickArea').addEventListener('click', e=>{
  const gain=clickPower();
  S.insight+=gain; S.total+=gain; S.clicks++;
  const f=document.createElement('div');
  f.className='float';
  f.textContent='+'+fmt(gain);
  f.style.left=(e.offsetX)+'px'; f.style.top=(e.offsetY)+'px';
  $('clickArea').appendChild(f);
  setTimeout(()=>f.remove(), 1000);
  checkEra(); render();
});
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('panel-discover').style.display = t.dataset.tab==='discover'?'block':'none';
    $('panel-works').style.display = t.dataset.tab==='works'?'block':'none';
  };
});
$('reset').onclick=()=>{
  if(confirm('Abandon all progress?')){
    localStorage.removeItem('ages_save');
    location.reload();
  }
};

// ---------- save/load ----------
function save(){
  S.last=Date.now();
  localStorage.setItem('ages_save', JSON.stringify(S));
}
function load(){
  try{
    const raw=localStorage.getItem('ages_save');
    if(!raw) return;
    const old=JSON.parse(raw);
    Object.assign(S, old);
    const away=(Date()-S.last)/1000;
    if(away>60){
      const earned=cps()*Math.min(away, 3600*8);
      if(earned>0){
        S.insight+=earned; S.total+=earned;
        setTimeout(()=>log('While you were gone, understanding grew: +'+fmt(earned)),500);
      }
    }
  }catch(e){}
  const e=ERAS[S.era]||ERAS[0];
  $('eraTitle').textContent=e.name;
  $('eraSub').textContent=e.sub;
  $('glyph').textContent=e.glyph;
  $('glyph').style.color=e.color;
}

// ---------- loop ----------
load();
render();
setInterval(()=>{
  const gain=cps();
  S.insight+=gain; S.total+=gain;
  checkEra(); render(); save();
},1000);
</script>
</body>
</html>
