<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  #eraTitle {
    font-size: 1.6em;
    letter-spacing: 4px;
    color:e8e8f0;
    text-transform: uppercase;
    text-align: center;
    transition: color 2s;
    margin: 4px;
  }
  #eraSub {
    font-style: italic;
    color: #666670;
    font-size: 0.95em;
    margin-bottom: 24px;
    text-align: center;
    min-height: 1.2em;
  }
  #counter {
    font-size: 2.4em;
    color: #d4c98a;
    margin-bottom: 6px;
  }
  #perSec {
    color: #55555f;
    margin-bottom: 28px;
  }
  #clickArea {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid #2a2a35;
    cursor: pointer;
    position: relative;
    background: radial-gradient(circle at 35% 35%, #1d1d2a, #101018);
    transition: transform 0.05s;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #click:active { transform: scale(0.96); }
  #glyph {
    font-size: 64px;
    color: #8a8672;
    transition: color 1s;
  }
  .float {
    position: absolute;
    pointer-events: none;
    font-size: 1.1em;
    color: #d4c98a;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }
  . { display: flex; gap: 8px; margin: 20px 0 12px; }
  .tab {
    padding 8px 18px;
    border: 1px solid #2a2a35;
    background: transparent;
    color: #77777f;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.8em;
  }
  .tab.active { color: #d4c98a; border-color: #4a4636; }
  .panel { width: 100%; max-width: 640px; min-height: 200px; }
  .row {
    border: 1px solid #1d1d28;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row.afford { border-color: #3a3828; cursor: pointer; }
  .row.afford:hover { background: #14141c; }
  .row .name { color: #d8d4c0; }
  .row .desc { font-size: 0.8em; color: #666670; margin-top: 2px; }
  .rowcost { color: #b09d5a; white-space: nowrap; margin-left: 16px; }
  .hiddenRow {
    border: 1px dashed #1a1a24;
    color: #3a3a44;
    padding: 12px 16px;
    margin-bottom: 8px;
    text-align: center;
    font-style: italic;
  }
  #log {
    max-width: 640px;
    width: 100%;
    margin-top: 24px;
    border-top: 1px solid #1d1d28;
    padding-top: 14px;
  }
  .logline {
    color: #55555f;
    font-size: 0.85em;
    font-style: italic;
    padding: 3px 0;
  }
  .logline.major { color: #b8a96a; }
  #flash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s;
  }
  .buyMax { font-size: 0.75em; color: #6a6450; }
  #reset {
    margin-top: 30px;
    background: none;
    border: none;
    color: #33333a;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75em;
  }
  #reset:hover { color: #6a4a4a; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="eraTitle">The Beginning</div>
<div id="eraSub"></div>
<div id="counter">0</div>
<div id="perSec">per second: 0</div>

<div id="clickArea"><span id="glyph">●</span></div>

<div classtabs">
  <button class="tab active" data-tab="discover">Discover</button>
  <button class="tab" data-tab="">Works</button>
</div>
<div class="panel" id="panel-discover"></div>
<div class="panel" id="panel-works" style="display:none"></div>

<div id="log"></div>
<button id="reset">abandon everything</button>

<script>
"use strict// ---------- state ----------
var S = {
  insight: 0,
  total: 0,
  clicks: 0,
  discoveries: {},
  works: {},
  era: 0,
  last: Date.now()
};

// ---------- discoveries (generators + click upgrades) ----------
var DISCOVERIES = [
  { id: "d1",  era: 0, name: "Curiosity", desc:The mind begins to wonder.",       base: 15,     growth: 1.15, cps: 0.1,   click: 0 },
  { id: "d2",  era: 0, name: "Language",  desc: "Ideas can now be shared.",         base: 100,    growth: 1.15, cps: 1,     click: 0 },
  { id: "d3",  era: 0, name: "Fire",      desc: "Warmth in the darkness.",          base: 60,     growth: 1.18, cps: 0,     click: 1 },
  { id: "d4",  era: 1, name: "??",        desc: "??", base: 1100,   growth: 1.15, cps: 8,       click: 0, hint: "Something that turns soil." },
  { id: "d5",  era: 1, name: "??",        desc: "??", base: 12000,  growth: 1.15, cps: 47,      click: 0, hint: "Herds, gathered and kept." },
  { id: "d6",  era: 2, name: "??",        desc: "??", base: 130000, growth: 1.15, cps: 260,     click: 0, hint: "It can be shaped, and keeps its edge." },
  { id: "d7",  era: 2, name: "??",        desc: "", base: 1400000, growth: 1.15, cps: 1400,  click: 0, hint: "Words that outlive their speakers." },
  { id: "8",  era: 3, name: "??",        desc: "??", base: 20000000, growth: 1.15, cps: 7800, click: 0, hint: "Not by muscle alone." },
  { id: "d9",  era: 3, name: "??",        desc: "??", base: 330000000, growth: 1.15, cps: 44000, click: 0, hint: "Rot, harnessed." },
  { id: "d10", era: 4, name: "??",        desc: "??", base: 510000000, growth: 1.15, cps: 260000, click: 0, hint: "Braided lightning." },
  { id: "d11", era: 4, name: "??",        desc: "??", base: 75000000000, growth: 1.15, cps: 1600000, click: 0, hint: "A machine that dreams in numbers." },
  { id: "d12", era: 5, name: "??",        desc: "??", base: 1000000000000, growth: 1.15, cps: 10000000, click: 0, hint: "The smallest things, rearranged." },
  { id: "d13", era: 5, name: "??",        desc: "??", base: 14000000000000, growth: 1.15, cps: 65000000, click: 0, hint: "Departure." }
];

// ---------- works (one-time boosts) ----------
var WORKS = [
  { id: "w1",  era: 0, name: "Named the Stars", desc: "Clicks are worth more.",        cost: 500,        clickMult: 2 },
  { id: "w2",  era: 1, name: "The Wheel",       desc: "Everything turns easier.",      cost: 20000,      cpsMult: 1.5 },
  { id: "w3",  era: 1,: "Written Law",     desc: "What was agreed is remembered.", cost: 150000,    cpsMult: 1.5 },
  { id: "w4",  era: 2, name: "??", desc: "??", cost: 2000000,      clickMult: 3, hint: "A structure that reaches." },
  { id: "w5",  era: 2, name: "??", desc: "??", cost: 20000000,     cpsMult: 2,   hint: "A disease made harmless." },
  { id: "w6",  era: 3, name: "??", desc: "??", cost: 500000000,    cpsMult: 2,   hint: "The world, drawn whole." },
  { id: "w7",  era: 3, name: "??", desc: "??", cost: 9000000000,   clickMult: 5, hint: "Voices carried without wires." },
  { id: "w8",  era: 4, name: "??", desc: "??", cost: 200000000000, cpsMult: 2.5, hint: "Taming the sun's fire, briefly." },
  { id: "w9",  era: 4, name: "??", desc: "??", cost: 4000000000000, cpsMult: 2.5, hint: "A network of everyone." },
  { id: "w10", era: 5, name: "??", desc: "??", cost: 90000000000000, cpsMult: 3, hint: "Machines that teach themselves." }
];

// ---------- eras ----------
var ERAS = [
  { at: 0,     name: "The Dawn", sub "nothing is certain yet", glyph: "●", color: "#8a8672" },
  { at: 500,   name: "??", sub: "??", glyph: "?", color: "#a08a5a" },
  { at: 50000, name: "??", sub: "??", glyph: "?", color: "#b8a96a" },
  { at: 5000000, name: "??", sub: "??", glyph: "?", color: "#c9b070" },
  { at: 200000000, name: "??", sub: "??", glyph: "?", color: "#9aa8b8" },
  { at: 50000000000, name: "", sub: "??", glyph: "?", color: "#aab8d0" },
  { at: 10000000000000, name: "??", sub: "??", glyph: "?", color: "#c8b8e8" }
];

// ---------- helpers ----------
function $(id) { return document.getElementById(id); }

function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  var units = ["K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp"];
  var i = -1;
  while (n >= 1000 && i < units.length - 1) {
    = n / 1000;
    i = i + 1;
  }
  return n.toFixed(2) + units[i];
}

 log(msg, major) {
  var el = document.createElement("div");
  el.className = major ? "logline major" : "logline";
  el.textContent = msg;
  var logEl = $("log");
  logEl.insertBefore(el, logEl.firstChild);
}

function discoverCost(d) {
  return d.base * Math.pow(d.growth, S.discoveries[d.id] || 0);
}

function cps() {
  var sum = 0;
  var mult = 1;
  var i, d, w;
  for (i = 0; i < DISCOVERIES.length; i++) {
    d = DISCOVERIES[i];
    sum += (S.discoveries[d.id] || 0) * d.cps;
  }
  for (i = 0; i < WORKS.length; i++) {
    w = WORKS[i];
    if (S.works[w.id] && w.cpsMult) mult = mult * w.cpsMult;
  }
  return sum * mult;
}

function clickPower() {
  var base = 1;
  var mult = 1;
  var i, d, w;
  for (i = 0; i < DISCOVERIES.length; i++) {
    d = DISCOVERIES[i];
    base += (S.discoveries[d.id] || 0) * d.click;
  }
  for (i = 0; i < WORKS.length; i++) {
    w = WORKS[i];
    if (S.works[w.id] && w.clickMult) mult = mult * w.clickMult;
  }
  return base * mult;
}

// ---------- era transitions ----------
function checkEra() {
  var i, e;
  for (i = ERAS.length - 1; i > 0; i--) {
    if (S.era < i && S.total >= ERAS[i].at) {
      S.era = i;
      e = ERAS[i];
      $("eraTitle").textContent = e.name;
      $("eraSub").textContent = e.sub;
      $("glyph").textContent = e.glyph;
      $("glyph").style.color = e.color;
      $("flash").style.opacity = 0.5;
      setTimeout(function () { $("flash").style.opacity = 0; }, 300);
      log("A new age begins.", true);
      save();
      break;
    }
  }
}

// ---------- rendering ----------
function renderDiscoveries() {
  var p = $("panel-discover");
  p.innerHTML = "";
  var i, d, owned, cost, shown, row;
  for (i = 0; i < DISCOVERIES.length; i++) {
    d = DISCOVERIES[i];
    if (d.era > S.era) continue;
    owned = S.discoveries[d.id] || 0;
    cost = discoverCost(d);
    shown = (d.name !== "??") || (owned > 0) || (S.insight >= cost * 0.4);
    row = document.createElement("div");
    if (!shown) {
      row.className = "hiddenRow";
      row.textContent = d.hint || "something waits to be found";
    } else {
      var name = (d.name === "??") ? "A Strange Idea" : d.name;
      var desc = (d.name === "??") ? "??" : d.desc;
      row.className = (S.insight >= cost) ? "row afford" : "row";
      row.innerHTML =
        '<div><div class="name">' + name +
        ' <span class="buyMax">x' + owned + "</span></div>" +
        '<div class="desc">' + desc + " · +" + d.cps + "/s" +
        (d.click ? " · +" + d.click + "/click" : "") +
        '</div></div><div class="cost">' + fmt(cost) +</div>";
      row.onclick = (function (disc, c) {
        return function () {
          if (S.insight >= c) {
            S.insight = S.insight - c;
            S.discoveries[disc.id] = (S.discoveries[disc.id] || 0) + 1;
            if (disc.name === "??") log("Discovered: " + disc.name, true);
            render();
            save();
          }
        };
      })(d, cost);
    }
    p.appendChild(row);
  }
  if (S.era < ERAS.length - 1) {
    var next = ERAS[S.era + 1];
    var bar = document.createElement("div");
    bar.className = "hiddenRow";
    bar.textContent = "something greater stirs... (" + fmt(S) + " / " + fmt(next.at) + ")";
    p.appendChild(bar);
  }
}

function renderWorks() {
  var p = $("panel-works");
  p.innerHTML = "";
  var any = false;
  var i, w, shown, row;
  for (i = 0; i < WORKS.length; i++) {
    w = WORKS[i];
    if (w.era > S.era) continue;
    if (S.works[w.id]) continue;
    any = true;
    shown = (w.name !== "??") || (S.insight >= w.cost * 0.25);
    row = document.createElement("div");
    if (!shown) {
      row.className = "hiddenRow";
      row.textContent = w.hint || "a great work waits";
    } else {
      var name = (w.name === "??") ? "An Unfinished Work" : w.name;
      var desc = (w.name === "??") ? "??" : w.desc;
      var effect = w.clickMult
        ? "x" + w.clickMult + " clicks"
        : "x" + w.cpsMult + " production";
      row.className = (S.insight >= w.cost) ? "row afford" : "row";
      row.innerHTML =
        '<div><div class="name">' + name + "</div>" +
        '<div class="desc">' + desc + " · " + effect +
        '</div></div><div class="cost">' + fmt(w.cost) + "</div>";
      row.onclick = (function (work) {
        return function () {
          if (S.insight >= work.cost) {
            S.insight = S.insight - work.cost;
            S.works[work.id] = true;
            log("Completed: " + work.name, true);
            render();
            save();
          }
        };
      })(w);
    }
    p.appendChild(row);
  }
  if (!any) {
    p.innerHTML = '<div class="hiddenRow">nothing worth building... yet</div>';
  }
}

function render() {
  $("counter").textContent = fmt(S.insight);
  $("perSec").textContent = "per second: " + fmt(cps());
  renderDiscoveries();
  renderWorks();
}

// ---------- input ----------
$("clickArea").addEventListener("click", function (e) {
  var gain = clickPower();
  S.insight = S.insight + gain;
  S.total = S.total + gain;
  S.clicks = S.clicks + 1;
  var f = document.createElement("div");
  f.className = "float";
  f.textContent = "+" + fmt(gain);
  f.style.left = e.offsetX + "px";
  f.style.top = e.offsetY + "px";
  $("clickArea").appendChild(f);
  setTimeout(function () { f.remove(); }, 1000);
  checkEra();
  render();
});

var tabs = document.querySelectorAll(".tab");
for (var t = 0; t < tabs.length; t++) {
  tabs[t].onclick = function () {
    var btn = this;
    var all = document.querySelectorAll(".tab");
    for (var j = 0; j < all.length; j++) all[j].classList.remove("active");
    btn.classList.add("active");
    $("panel-discover").style.display = (btn.dataset.tab === "discover") ? "block" : "none";
    $("panel-works").style.display = (btn.dataset.tab === "works") ? "block" : "none";
  };
}

$("reset").onclick = function () {
  if (confirm("Abandon all progress?")) {
    localStorage.removeItem("ages_save");
    location.reload();
  }
};

// ---------- save/load ----------
function save() {
  S.last = Date.now();
  localStorage.setItem("ages_save", JSON.stringify(S));
}

function load() {
  try {
    var raw = localStorage.getItem("ages_save");
    (raw) {
      var old = JSON.parse(raw);
      S.insight = old.insight || 0;
      S.total = old.total || 0;
      S.clicks = old.clicks ||0;
      S.discoveries = old.discoveries || {};
      S.works = old.works || {};
      S.era = old.era || 0;
      S.last = old.last || Date.now();
      var away = (Date.now() - S.last) / 1000;
      if (away > 60) {
        var earned = cps() * Math.min(away, 3600 * 8);
        if (earned > 0) {
          S.insight += earned;
          S.total += earned;
          setTimeout(function () {
            log("While you were gone, understanding grew: +" + fmt(earned));
          }, 500);
        }
      }
    }
  } catch (err) { /* corrupted save, start fresh */ }
  var e = ERAS[S.era] || ERAS[0];
  $("eraTitle").textContent = e.name;
  $("eraSub").textContent = e.sub;
  $("glyph").textContent = e.glyph;
  $("glyph").style.color = e.color;
}

// ---------- loop ----------
load();
render();
setInterval(function () {
  var gain = cps();
  S.insight += gain;
  S.total += gain;
  checkEra();
  render();
  save();
}, 1000);
</script>
</body>
</html>
